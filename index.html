<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Local Pieces</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Carlito is the open Calibri look-alike, used when Calibri isn't installed -->
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <!-- MENU -->
    <section id="menu" class="page active">
      <div class="menu-inner">
        <h1 class="logo">Local Pieces</h1>

        <div class="modes">
          <button class="mode" data-mode="basic">
            <span class="mode-name">Classic</span>
            <span class="mode-desc">Standard chess, two players on one screen.</span>
          </button>
          <button class="mode" data-mode="secret">
            <span class="mode-name">Secret Queen</span>
            <span class="mode-desc">Each player secretly picks a pawn that can move like a queen.</span>
          </button>
          <button class="mode" data-mode="tas">
            <span class="mode-name">TAS</span>
            <span class="mode-desc">Single player against the computer, with undo, redo and mate hints.</span>
          </button>
        </div>

        <div id="saved" class="saved hidden">
          <h2>Saved replays</h2>
          <ul id="saved-list"></ul>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="game" class="page">
      <header class="game-header">
        <button id="back-btn" class="text-btn" aria-label="Back to menu">&larr; Menu</button>
        <span id="mode-title" class="mode-title">Classic</span>
        <span class="header-spacer"></span>
      </header>

      <div class="layout">
        <div class="board-col">
          <div class="player-bar" id="top-bar">
            <span class="dot" id="top-dot"></span>
            <span class="pname" id="top-name"></span>
            <span class="captured" id="top-captured"></span>
          </div>

          <div class="board-wrap">
            <div id="board" class="board"></div>
            <div id="cover" class="cover hidden"></div>
            <div id="toast" class="toast" role="status"></div>
          </div>

          <div class="player-bar" id="bottom-bar">
            <span class="dot" id="bottom-dot"></span>
            <span class="pname" id="bottom-name"></span>
            <span class="captured" id="bottom-captured"></span>
          </div>

          <div id="status" class="status">&nbsp;</div>

          <!-- secret queen pick bar -->
          <div id="pick-bar" class="pick-bar hidden">
            <button id="pick-confirm" class="btn primary" disabled>Confirm</button>
          </div>

          <!-- live game controls -->
          <div id="controls" class="controls">
            <button id="flip-btn" class="btn">Flip</button>
            <button id="undo-btn" class="btn">Undo</button>
            <button id="redo-btn" class="btn">Redo</button>
            <button id="hint-btn" class="btn hidden">Hint</button>
            <button id="pause-btn" class="btn hidden">Pause</button>
            <button id="both-btn" class="btn hidden" aria-pressed="false">Both sides</button>
            <button id="save-btn" class="btn hidden">Save TAS</button>
            <button id="reset-btn" class="btn">New game</button>
          </div>

          <!-- replay controls -->
          <div id="replay-controls" class="replay-controls hidden">
            <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Replay position">
            <div class="replay-row">
              <button id="rp-start" class="btn icon" aria-label="Start">&#9198;&#xFE0E;</button>
              <button id="rp-prev" class="btn icon" aria-label="Previous move">&#9664;&#xFE0E;</button>
              <button id="rp-play" class="btn primary play" aria-label="Play or pause">Play</button>
              <button id="rp-next" class="btn icon" aria-label="Next move">&#9654;&#xFE0E;</button>
              <button id="rp-end" class="btn icon" aria-label="End">&#9197;&#xFE0E;</button>
              <button id="rp-speed" class="btn speed" aria-label="Speed">1x</button>
            </div>
            <button id="rp-exit" class="btn wide">Close replay</button>
          </div>
        </div>

        <aside class="side">
          <h3>Moves</h3>
          <div class="moves-scroll" id="moves-scroll">
            <div id="move-list" class="move-list"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- SHEET (names, hand-off, game over, save) -->
    <div id="sheet-bg" class="sheet-bg hidden">
      <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
    </div>
  </div>

  <script src="chess.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
